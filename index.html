<head>

<title>미디어볼 프로젝트</title>

==================== 설정 방법 ====================
Firebase 규칙 (Firestore > 규칙):

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /projects/{id} {
      allow read, write: if request.auth != null

    }
  }

FIREBASE_CONFIG를 비워두면 '체험 모드'로 동작합니다 (이 브라우저에만 저장).
=====================================================
-->
<style>
:root{
  --bg:#f3f4f5; --panel:#ffffff; --ink:#14171a; --mu:#6a7077; --line:#e2e4e7; --soft:#eceef0;
  --btn:#14171a; --btnx:#ffffff; --danger:#c62828;
  --s-pre:#8b9299; --s-prod:#3b7ddd; --s-post:#d6a01a; --s-done:#39a275;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --num:"Archivo","Pretendard Variable",Pretendard,sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1012; --panel:#16191c; --ink:#eceff1; --mu:#8b9299; --line:#24282c; --soft:#1d2125;
  --btn:#eceff1; --btnx:#0e1012; --danger:#ef6b6b;
  --s-prod:#5b9bf0; --s-post:#e5b53a; --s-done:#4fbf8f;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:1120px;margin:0 auto;padding:0 20px calc(48px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--mu);font-size:13px}
.num{font-family:var(--num);font-stretch:112%;font-variant-numeric:tabular-nums}

/* 상단 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:30px 0 22px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:nowrap}
.brand h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand .en{font-family:var(--num);font-stretch:125%;font-weight:600;font-size:12px;color:var(--mu);letter-spacing:.04em}
.acts{display:flex;gap:8px;flex:none}
.btn{border:0;background:var(--btn);color:var(--btnx);border-radius:10px;padding:9px 15px;font-weight:600;white-space:nowrap}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;white-space:nowrap}
.sm{font-size:13px;padding:8px 11px;color:var(--mu)}
.danger{color:var(--danger)}
.banner{background:var(--soft);color:var(--mu);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 14px}

/* 탭 */
.tabs{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto}
.tabs a,.tabs button{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);text-decoration:none;white-space:nowrap;font-size:14px;font-weight:500}
.tabs .on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* 장부 요약 */
.ledger{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.k{padding:22px 22px 22px 24px;border-left:1px solid var(--line);min-width:0}
.k:first-child{border-left:0;padding-left:0}
.k-l{font-size:13px;color:var(--mu);margin-bottom:10px}
.k-big{font-family:var(--num);font-stretch:112%;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(40px,7vw,72px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.k-v{font-family:var(--num);font-stretch:108%;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(20px,2.4vw,26px);line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
.k-big em,.k-v em{font-style:normal;font-family:var(--sans);font-stretch:100%;font-weight:600;color:var(--mu);margin-left:.18em}
.k-big em{font-size:.3em}
.k-v em{font-size:.55em}
.k-s{font-size:13px;color:var(--mu);margin-top:10px}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--soft);margin:18px 0 10px}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mu);margin-bottom:26px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-Pre{background:var(--s-pre)}.d-Production{background:var(--s-prod)}.d-Post{background:var(--s-post)}.d-Done{background:var(--s-done)}

/* 필터 */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1;min-width:150px}
.filters select{width:auto}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);white-space:nowrap}
.filters input[type=checkbox]{width:auto}

/* 목록 */
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:minmax(0,1fr) 5.5rem 7rem 5.4rem 5.4rem 5.4rem 7.4rem;column-gap:12px;align-items:center;padding:0 20px}
.lh{height:40px;background:var(--soft);font-size:12.5px;color:var(--mu)}
.row{min-height:56px;padding-top:12px;padding-bottom:12px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.lh+.row{border-top:0}
.row:hover{background:var(--soft)}
.m{display:contents}
.c-n{order:0;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-cat{order:1;color:var(--mu);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-s{order:2;display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.c-reg{order:3}.c-start{order:4}.c-due{order:5}
.c-reg,.c-start,.c-due{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu)}
.c-amt{order:6;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px}
.lh span:last-child{text-align:right}
.c::before{display:none}
.hd-1{order:0}.hd-2{order:1}.hd-3{order:2}.hd-4{order:3}.hd-5{order:4}.hd-6{order:5}.hd-7{order:6}

/* 보드 */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{flex:1 0 250px;min-width:250px;background:var(--soft);border-radius:14px;padding:12px}
.col h3{margin:2px 4px 12px;font-size:14px;display:flex;align-items:center;gap:8px;font-weight:600}
.col.over{outline:2px dashed var(--ink)}
.kcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;text-decoration:none;color:inherit}
.kcard b{display:block;margin-bottom:3px;font-weight:600}
.kcard small{color:var(--mu);font-size:12.5px}
.empty{text-align:center;padding:44px 12px;color:var(--mu);border:1px dashed var(--line);border-radius:14px}

/* 상세 */
.bar{display:flex;align-items:center;gap:10px;padding:18px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.title{font-size:21px;font-weight:700;border:0;background:transparent;padding:6px 4px;letter-spacing:-.01em}
.metarow{display:flex;gap:8px;margin-bottom:14px}
.metarow>*{flex:1}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
textarea.notes{min-height:52vh;resize:vertical;line-height:1.75;border:0;padding:2px;background:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label.f{display:block;font-size:12.5px;color:var(--mu)}
label.f input,label.f textarea{margin-top:5px;color:var(--ink);font-size:15px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.sum div{background:var(--soft);border-radius:12px;padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.sum small{display:block;color:var(--mu);font-size:12.5px}
.sum b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16px}
h4{margin:18px 0 8px;font-size:14px;font-weight:600}
.erow{display:grid;grid-template-columns:1fr 140px 38px;gap:6px;margin-bottom:6px}
.lrow{display:grid;grid-template-columns:130px 1fr 38px 38px;gap:6px;margin-bottom:6px}
.x{border:1px solid var(--line);background:var(--panel);border-radius:10px}
.login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.login h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}

/* 모바일 */
@media(max-width:760px){
  #app{padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  .top{padding:22px 0 16px}
  .brand h1{font-size:22px}
  .brand .en{display:none}
  .ledger{grid-template-columns:1fr}
  .k:first-child{padding:18px 0}
  .k:not(:first-child){display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:baseline;border-left:0;border-top:1px solid var(--line);padding:12px 0}
  .k:not(:first-child) .k-l{margin:0}
  .k:not(:first-child) .k-v{text-align:right;font-size:20px}
  .k:not(:first-child) .k-s{grid-column:1/-1;margin-top:2px}
  .lh{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:6px;padding:14px 16px}
  .m{display:flex;flex-wrap:wrap;gap:2px 14px;grid-column:1/-1;order:3;font-size:12.5px;color:var(--mu)}
  .c-n{order:0}.c-s{order:1}
  .c::before{display:inline;content:attr(data-l) " ";color:var(--mu);opacity:.8}
  .c-cat::before,.c-amt::before{content:""}
  .c.e{display:none}
  .c-amt{text-align:left;font-size:12.5px}
  .grid4{grid-template-columns:1fr 1fr}
  .lrow{grid-template-columns:1fr 38px 38px}
  .lrow input:first-child{grid-column:1/-1}
  .erow{grid-template-columns:1fr 112px 38px}
  .sum b{font-size:14px}
  .sum div{padding:10px}
  .col{flex-basis:78vw;min-width:78vw}
}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* ================= 설정 ================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCAWMarH4esiWVb4p69EFamFWPO_t0riiQ",
  authDomain: "mediabowl-6d1a5.firebaseapp.com",
  projectId: "mediabowl-6d1a5",
  storageBucket: "mediabowl-6d1a5.firebasestorage.app",
  messagingSenderId: "26942835440",
  appId: "1:26942835440:web:a576eed2f8faf364501035"
};
const ALLOWED_EMAIL = ""; // 저장소가 Public이면 비워두세요 (보안은 Firestore 규칙이 담당)
const COMPANY = "미디어볼";
/* ======================================== */

const USE_FIREBASE = !!FIREBASE_CONFIG.apiKey;
const STATUSES = ["Pre", "Production", "Post", "Done"];
const LISTORD = { Production: 0, Post: 1, Pre: 2, Done: 3 };
const NUM = ["contract", "received"];
const CUR = new Date().getFullYear();

/* 노션 'Bowl 2026 Project List' 초기 데이터: [이름, 분류, 상태, 시작, 마감, 납기] */
const SEED = [
  ["알몸마라톤 티저","꼭대기","Done","2026-01-05","","2026-01-07"],
  ["윈터700","윈터700","Production","","",""],
  ["청년마을","꼭대기","Production","2026-01-05","",""],
  ["태학이형 시즌영상","보울","Production","2026-01-15","",""],
  ["꼭대기 운동마을 유튜브 기획","꼭대기","Production","","",""],
  ["알몸 마라톤","꼭대기","Done","2026-02-14","2026-02-14","2026-02-16"],
  ["로펫","","Done","","",""],
  ["미탄 아웃도어 빌리지_펨투어","꼭대기","Done","","",""],
  ["조각필름","","Production","","",""],
  ["클래식한 형들의 옷장","","Pre","","",""],
  ["SNK 2026","보울","Done","2026-05-26","2026-06-18","2026-06-15"],
  ["제주 오디션","","Done","","",""],
  ["서울창경","","Done","","",""],
  ["강원랜드 도박방지","","Done","","",""],
  ["휠로그 제안서","","Done","","",""],
  ["온기잇다_기억되게 하기","보울","Done","2026-08-11","2026-09-12",""],
  ["k - local","","Done","","",""],
  ["지은이 컨설팅","","Production","","",""],
  ["온기잇다_ep2.호스피스","","Pre","","",""],
  ["소상공인 도약지원 메가쇼_일산","","Pre","","",""],
  ["26모두의창업","","Pre","","",""]
];

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = n => (Number(n) || 0).toLocaleString("ko-KR");
const won = n => nf(n) + "원";
const money = n => n >= 1e8 ? `${(n / 1e8).toFixed(2).replace(/\.?0+$/, "")}<em>억원</em>` : `${nf(n)}<em>원</em>`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const ymd = d => { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const todayStr = () => ymd(new Date());
const dt = d => d ? d.slice(2).replace(/-/g, ".") : "";            // 2026-01-05 → 26.01.05
const regOf = p => p.registered || (p.createdAt ? ymd(new Date(p.createdAt)) : "");
const yearOf = p => +((p.start || p.due || regOf(p) || String(CUR)).slice(0, 4));
const sumExp = p => (p.expenses || []).reduce((a, e) => a + (Number(e.a) || 0), 0);
const margin = p => (Number(p.contract) || 0) - sumExp(p);
const unpaid = p => Math.max(0, (Number(p.contract) || 0) - (Number(p.received) || 0));
const mk = ([name, category, status, start, end, due]) => ({
  id: uid(), name, category, status, start, end, due, registered: todayStr(),
  contract: "", received: "", expenses: [], links: [], notes: "", contact: "",
  createdAt: Date.now(), updatedAt: Date.now()
});

/* ================= 저장소 ================= */
function localStore() {
  const LK = "bowl_projects_v1";
  let arr = JSON.parse(localStorage.getItem(LK) || "[]"), cb = () => {};
  const commit = () => { localStorage.setItem(LK, JSON.stringify(arr)); cb([...arr]); };
  return {
    mode: "local",
    onAuth(f) { f({ email: "체험 모드" }); },
    listen(f) { cb = f; f([...arr]); },
    async save(p) { const i = arr.findIndex(x => x.id === p.id); i < 0 ? arr.push(p) : (arr[i] = p); commit(); },
    async remove(id) { arr = arr.filter(x => x.id !== id); commit(); },
    async seed(items) { arr.push(...items); commit(); },
    signIn() {}, signOut() {}
  };
}

async function firebaseStore() {
  const B = "https://www.gstatic.com/firebasejs/10.14.1/";
  const [A, Au, Fs] = await Promise.all([
    import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")
  ]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app);
  const db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache() });
  const col = Fs.collection(db, "projects");
  let unsub = null;
  return {
    mode: "firebase",
    onAuth(f) {
      Au.onAuthStateChanged(auth, u => {
        if (u && ALLOWED_EMAIL && u.email !== ALLOWED_EMAIL) { Au.signOut(auth); alert("허용되지 않은 계정이에요."); return; }
        if (!u && unsub) { unsub(); unsub = null; }
        f(u);
      });
    },
    listen(f) { if (unsub) unsub(); unsub = Fs.onSnapshot(col, s => f(s.docs.map(d => ({ ...d.data(), id: d.id })))); },
    save: p => Fs.setDoc(Fs.doc(db, "projects", p.id), p),
    remove: id => Fs.deleteDoc(Fs.doc(db, "projects", id)),
    async seed(items) { const b = Fs.writeBatch(db); items.forEach(p => b.set(Fs.doc(db, "projects", p.id), p)); await b.commit(); },
    signIn: () => Au.signInWithPopup(auth, new Au.GoogleAuthProvider()),
    signOut: () => Au.signOut(auth)
  };
}

/* ================= 상태 ================= */
const app = $("#app");
let store, user = null, projects = [], ready = false;
const F = { q: "", cat: "", showDone: false, year: CUR };
let detailTab = "notes";
const pending = new Map();
let saveTimer = null;

function persist(p) {
  p.updatedAt = Date.now();
  pending.set(p.id, p);
  const s = $("#saved"); if (s) s.textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
function flush() {
  clearTimeout(saveTimer);
  pending.forEach(p => store.save(p));
  pending.clear();
  const s = $("#saved"); if (s) s.textContent = "저장됨";
}
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
addEventListener("pagehide", flush);

const routeId = () => { const m = location.hash.match(/^#\/p\/(.+)$/); return m ? m[1] : null; };
const cur = () => { const id = routeId(); return id ? projects.find(p => p.id === id) : null; };

/* ================= 로그인 ================= */
function renderLogin() {
  app.innerHTML = `<div class="login"><h1>${COMPANY}</h1><p class="muted">프로젝트 현황을 보려면 로그인하세요</p>
  <button class="btn" data-act="login">Google로 로그인</button></div>`;
}

/* ================= 메인 ================= */
function render() {
  if (!user) return renderLogin();
  const id = routeId();
  if (id) return renderDetail(id);
  renderMain();
}

function renderMain() {
  const board = location.hash === "#/board";
  const cats = [...new Set(projects.map(p => p.category).filter(Boolean))];
  const years = [...new Set([...projects.map(yearOf), CUR])].sort((a, b) => b - a);
  app.innerHTML = `
  <header class="top">
    <div class="brand"><h1>${COMPANY}</h1><span class="en">MediaBowl</span></div>
    <div class="acts"><button class="btn" data-act="new">+ 새 프로젝트</button>
      <button class="ghost sm" data-act="logout" title="${esc(user.email || "")}">로그아웃</button></div>
  </header>
  ${store.mode === "local" ? `<div class="banner">체험 모드: 이 브라우저에만 저장돼요. Firebase 설정을 넣으면 폰과 PC가 동기화돼요.</div>` : ""}
  <nav class="tabs"><a href="#/" class="${board ? "" : "on"}">목록</a><a href="#/board" class="${board ? "on" : ""}">보드</a></nav>
  <div id="stats"></div>
  <div class="filters">
    <select id="fyear"><option value="0" ${F.year === 0 ? "selected" : ""}>전체 연도</option>${years.map(y => `<option value="${y}" ${F.year === y ? "selected" : ""}>${y}년</option>`).join("")}</select>
    <input type="search" id="q" placeholder="프로젝트 검색" value="${esc(F.q)}">
    <select id="fcat"><option value="">전체 분류</option>${cats.map(c => `<option ${F.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <label><input type="checkbox" id="fdone" ${F.showDone ? "checked" : ""}> 완료 포함</label>
  </div>
  <div id="content"></div>`;
  renderContent();
}

const inYear = p => !F.year || yearOf(p) === F.year;
function filtered() {
  const q = F.q.toLowerCase();
  return projects.filter(p =>
    inYear(p) &&
    (F.showDone || p.status !== "Done") &&
    (!F.cat || p.category === F.cat) &&
    (!q || (p.name + " " + (p.category || "")).toLowerCase().includes(q)));
}
const byDate = (a, b) => (a.start || a.due || regOf(a) || "9999").localeCompare(b.start || b.due || regOf(b) || "9999");

function renderStats() {
  const yp = projects.filter(inYear);
  const n = s => yp.filter(p => p.status === s).length;
  const revenue = yp.reduce((a, p) => a + (Number(p.contract) || 0), 0);
  const received = yp.reduce((a, p) => a + (Number(p.received) || 0), 0);
  const unp = yp.reduce((a, p) => a + unpaid(p), 0);
  const withC = yp.filter(p => Number(p.contract) > 0);
  const mar = withC.reduce((a, p) => a + margin(p), 0);
  const marPct = revenue ? Math.round(mar / revenue * 100) : null;
  const rcvPct = revenue ? Math.round(received / revenue * 100) : null;
  const label = F.year ? `${F.year} 누적 매출` : "전체 누적 매출";
  const total = yp.length;
  const active = n("Production") + n("Post");
  const order = ["Production", "Post", "Pre", "Done"];

  $("#stats").innerHTML = `
  <section class="ledger">
    <div class="k"><div class="k-l">${label}</div>
      <div class="k-big">${money(revenue)}</div>
      <div class="k-s">${revenue ? `입금 ${won(received)}` : "프로젝트의 계약금액을 입력하면 집계돼요"}</div></div>
    <div class="k"><div class="k-l">프로젝트</div>
      <div class="k-v">${total}<em>건</em></div>
      <div class="k-s">진행 중 ${active}건</div></div>
    <div class="k"><div class="k-l">미수금</div>
      <div class="k-v">${money(unp)}</div>
      <div class="k-s">${rcvPct === null ? "-" : `입금률 ${rcvPct}%`}</div></div>
    <div class="k"><div class="k-l">마진</div>
      <div class="k-v">${money(mar)}</div>
      <div class="k-s">${marPct === null ? "-" : `마진율 ${marPct}%`}</div></div>
  </section>
  <div class="sbar" role="img" aria-label="상태별 프로젝트 비율">${total ? order.map(s => n(s) ? `<i class="d-${s}" style="width:${n(s) / total * 100}%"></i>` : "").join("") : ""}</div>
  <div class="legend">${order.map(s => `<span><i class="dot d-${s}"></i>${s} ${n(s)}</span>`).join("")}</div>`;
}

function renderContent() {
  const c = $("#content"); if (!c) return;
  renderStats();
  const board = location.hash === "#/board";

  if (!projects.length) {
    c.innerHTML = `<div class="empty">아직 프로젝트가 없어요.<br><br>
      <button class="btn" data-act="seed">노션 올해 목록 21건 불러오기</button></div>`;
    return;
  }
  const list = filtered();
  if (!list.length) { c.innerHTML = `<div class="empty">조건에 맞는 프로젝트가 없어요.</div>`; return; }

  if (board) {
    const cols = STATUSES.filter(s => F.showDone || s !== "Done");
    c.innerHTML = `<div class="board">${cols.map(s => {
      const items = list.filter(p => p.status === s).sort(byDate);
      return `<div class="col" data-status="${s}"><h3><i class="dot d-${s}"></i>${s} <span class="muted">${items.length}</span></h3>
      ${items.map(p => `<a class="kcard" href="#/p/${p.id}" draggable="true" data-id="${p.id}"><b>${esc(p.name)}</b>
        <small>${esc(p.category || "")}${p.due ? (p.category ? "  " : "") + "납기 " + dt(p.due) : ""}</small></a>`).join("")}</div>`;
    }).join("")}</div>`;
  } else {
    list.sort((a, b) => (LISTORD[a.status] - LISTORD[b.status]) || byDate(a, b));
    const cell = (cls, label, val) => `<span class="c ${cls}${val ? "" : " e"}" data-l="${label}">${val || ""}</span>`;
    c.innerHTML = `<div class="tbl">
      <div class="lh"><span class="hd-1">프로젝트</span><span class="hd-2">분류</span><span class="hd-3">상태</span><span class="hd-4">등록일</span><span class="hd-5">시작일</span><span class="hd-6">납기</span><span class="hd-7">계약금액</span></div>
      ${list.map(p => `<a class="row" href="#/p/${p.id}">
        <span class="c c-n">${esc(p.name)}</span>
        <span class="c c-s"><i class="dot d-${p.status}"></i>${p.status}</span>
        <span class="m">
          ${cell("c-cat", "", esc(p.category))}
          ${cell("c-reg", "등록", dt(regOf(p)))}
          ${cell("c-start", "시작", dt(p.start))}
          ${cell("c-due", "납기", dt(p.due))}
          ${cell("c-amt", "", Number(p.contract) ? won(p.contract) : "")}
        </span></a>`).join("")}</div>`;
  }
}

/* ================= 상세 ================= */
function renderDetail(id) {
  const p = projects.find(x => x.id === id);
  if (!p) { app.innerHTML = `<div class="empty" style="margin-top:40px">프로젝트를 찾을 수 없어요.<br><br><button class="ghost" data-act="back">← 목록으로</button></div>`; return; }
  const cats = [...new Set(projects.map(x => x.category).filter(Boolean))];
  app.innerHTML = `
  <div class="bar"><button class="ghost" data-act="back" aria-label="목록으로">←</button>
    <input class="title" data-f="name" value="${esc(p.name)}" style="flex:1" aria-label="프로젝트 이름">
    <span id="saved" class="muted"></span></div>
  <div class="metarow">
    <select data-f="status" aria-label="상태">${STATUSES.map(s => `<option ${p.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>
    <input data-f="category" list="catl" placeholder="분류 / 발주처" value="${esc(p.category)}" aria-label="분류">
    <datalist id="catl">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
  </div>
  <nav class="tabs">
    ${[["notes", "노트"], ["budget", "버짓"], ["info", "정보·링크"]].map(([k, l]) => `<button data-act="tab" data-t="${k}" class="${detailTab === k ? "on" : ""}">${l}</button>`).join("")}
  </nav>
  <div class="pane" id="pane"></div>`;
  renderPane(p);
}

function renderPane(p) {
  const el = $("#pane"); if (!el) return;
  document.querySelectorAll('[data-act="tab"]').forEach(b => b.classList.toggle("on", b.dataset.t === detailTab));
  if (detailTab === "notes") {
    el.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button class="ghost sm" data-act="today">+ 오늘 날짜</button></div>
    <textarea class="notes" id="notes" data-f="notes" placeholder="미팅 기록, 콘티 아이디어, 클라이언트 피드백">${esc(p.notes)}</textarea>`;
  } else if (detailTab === "budget") {
    el.innerHTML = `<div class="grid2">
      <label class="f">계약금액(원)<input type="number" inputmode="numeric" data-f="contract" value="${p.contract ?? ""}"></label>
      <label class="f">입금액(원)<input type="number" inputmode="numeric" data-f="received" value="${p.received ?? ""}"></label></div>
    <div class="sum"><div><small>지출 합계</small><b id="b-exp"></b></div><div><small>마진</small><b id="b-margin"></b></div><div><small>미수금</small><b id="b-unpaid"></b></div></div>
    <h4>지출 항목</h4><div id="exp"></div>
    <datalist id="exl"><option value="외주비"><option value="장비 렌탈"><option value="출장비"><option value="식비"><option value="인건비"><option value="음악·폰트 라이선스"><option value="기타"></datalist>
    <button class="ghost" data-act="addExp">+ 지출 추가</button>`;
    renderExp(p); updateBudget(p);
  } else {
    el.innerHTML = `<div class="grid4">
      <label class="f">등록일<input type="date" data-f="registered" value="${esc(regOf(p))}"></label>
      <label class="f">시작일<input type="date" data-f="start" value="${esc(p.start)}"></label>
      <label class="f">마감일<input type="date" data-f="end" value="${esc(p.end)}"></label>
      <label class="f">납기<input type="date" data-f="due" value="${esc(p.due)}"></label></div>
    <h4>발주처 담당자·연락처</h4>
    <textarea data-f="contact" rows="3" placeholder="담당자, 연락처, 메모">${esc(p.contact)}</textarea>
    <h4>링크 (드라이브, 리뷰, 레퍼런스)</h4><div id="lks"></div>
    <button class="ghost" data-act="addLink">+ 링크 추가</button>
    <div style="margin-top:28px;text-align:right"><button class="ghost danger" data-act="delProject">프로젝트 삭제</button></div>`;
    renderLinks(p);
  }
}

function renderExp(p) {
  p.expenses ||= [];
  $("#exp").innerHTML = p.expenses.map((e, i) => `<div class="erow">
    <input list="exl" placeholder="항목" data-ek="n" data-i="${i}" value="${esc(e.n)}">
    <input type="number" inputmode="numeric" placeholder="금액" data-ek="a" data-i="${i}" value="${e.a ?? ""}">
    <button class="x" data-act="delExp" data-i="${i}" aria-label="지출 삭제">✕</button></div>`).join("") || `<div class="muted" style="margin-bottom:8px">지출 항목이 없어요.</div>`;
}
function renderLinks(p) {
  p.links ||= [];
  $("#lks").innerHTML = p.links.map((l, i) => `<div class="lrow">
    <input placeholder="이름" data-lk="t" data-i="${i}" value="${esc(l.t)}">
    <input placeholder="https://" inputmode="url" data-lk="u" data-i="${i}" value="${esc(l.u)}">
    <button class="x" data-act="openLink" data-i="${i}" aria-label="링크 열기">↗</button>
    <button class="x" data-act="delLink" data-i="${i}" aria-label="링크 삭제">✕</button></div>`).join("") || `<div class="muted" style="margin-bottom:8px">링크가 없어요.</div>`;
}
function updateBudget(p) {
  const e = $("#b-exp"); if (!e) return;
  const has = Number(p.contract) > 0;
  e.textContent = won(sumExp(p));
  $("#b-margin").textContent = has ? `${won(margin(p))} (${Math.round(margin(p) / p.contract * 100)}%)` : "-";
  $("#b-unpaid").textContent = has ? won(unpaid(p)) : "-";
}

/* ================= 이벤트 ================= */
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { F.q = t.value; renderContent(); return; }
  const p = cur(); if (!p) return;
  if (t.dataset.f) {
    const f = t.dataset.f;
    p[f] = NUM.includes(f) ? (t.value === "" ? "" : Number(t.value)) : t.value;
    if (NUM.includes(f)) updateBudget(p);
    persist(p);
  } else if (t.dataset.ek) {
    const i = +t.dataset.i;
    p.expenses[i][t.dataset.ek] = t.dataset.ek === "a" ? (Number(t.value) || 0) : t.value;
    updateBudget(p); persist(p);
  } else if (t.dataset.lk) {
    p.links[+t.dataset.i][t.dataset.lk] = t.value; persist(p);
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fcat") { F.cat = t.value; renderContent(); }
  else if (t.id === "fdone") { F.showDone = t.checked; renderContent(); }
  else if (t.id === "fyear") { F.year = +t.value; renderContent(); }
});

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, p = cur(), i = +b.dataset.i;
  if (act === "login") {
    Promise.resolve(store.signIn()).catch(err => {
      const c = err && err.code || "";
      const hint = c === "auth/unauthorized-domain" ? "\n\nFirebase > Authentication > 설정 > 승인된 도메인에 이 사이트 도메인을 추가하세요."
        : c === "auth/operation-not-allowed" ? "\n\nFirebase > Authentication > 로그인 방법에서 Google을 사용 설정하세요."
        : c === "auth/popup-blocked" ? "\n\n브라우저 팝업 차단을 해제하세요."
        : "";
      alert("로그인 실패: " + (c || (err && err.message) || err) + hint);
    });
  }
  else if (act === "logout") { flush(); if (confirm("로그아웃할까요?")) store.signOut(); }
  else if (act === "back") { flush(); location.hash = "#/"; }
  else if (act === "new") {
    const name = prompt("프로젝트 이름"); if (!name || !name.trim()) return;
    const np = mk([name.trim(), F.cat, "Pre", "", "", ""]);
    projects.push(np); await store.save(np); detailTab = "notes"; location.hash = "#/p/" + np.id;
  }
  else if (act === "seed") { await store.seed(SEED.map(mk)); }
  else if (act === "tab") { detailTab = b.dataset.t; if (p) renderPane(p); }
  else if (!p) return;
  else if (act === "today") {
    const ta = $("#notes"); ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n\n" : "") + `## ${todayStr()}\n`;
    p.notes = ta.value; persist(p); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  else if (act === "addExp") { p.expenses.push({ n: "", a: 0 }); renderExp(p); persist(p); }
  else if (act === "delExp") { p.expenses.splice(i, 1); renderExp(p); updateBudget(p); persist(p); }
  else if (act === "addLink") { p.links.push({ t: "", u: "" }); renderLinks(p); persist(p); }
  else if (act === "delLink") { p.links.splice(i, 1); renderLinks(p); persist(p); }
  else if (act === "openLink") {
    let u = (p.links[i].u || "").trim(); if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    window.open(u, "_blank", "noopener");
  }
  else if (act === "delProject") {
    if (!confirm(`'${p.name}' 프로젝트를 삭제할까요? 되돌릴 수 없어요.`)) return;
    pending.delete(p.id); projects = projects.filter(x => x.id !== p.id);
    await store.remove(p.id); location.hash = "#/";
  }
});

/* 보드 드래그앤드롭 (데스크톱) */
let dragId = null;
app.addEventListener("dragstart", e => { const c = e.target.closest(".kcard"); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
app.addEventListener("dragover", e => { const c = e.target.closest(".col"); if (c && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== c && x.classList.remove("over")); c.classList.add("over"); } });
app.addEventListener("drop", e => {
  const c = e.target.closest(".col"); if (!c || !dragId) return;
  e.preventDefault();
  const p = projects.find(x => x.id === dragId);
  if (p && p.status !== c.dataset.status) { p.status = c.dataset.status; persist(p); flush(); }
  dragId = null; renderContent();
});
app.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });

addEventListener("hashchange", () => { flush(); render(); });

/* ================= 시작 ================= */
function onData(list) {
  projects = list.map(x => pending.get(x.id) || x);
  projects.forEach(p => { p.expenses ||= []; p.links ||= []; });
  if (!ready) { ready = true; render(); return; }
  if (routeId()) return;
  if ($("#content")) renderContent(); else render();
}

(async () => {
  app.innerHTML = `<div class="login"><span class="muted">불러오는 중…</span></div>`;
  try { store = USE_FIREBASE ? await firebaseStore() : localStore(); }
  catch (err) { app.innerHTML = `<div class="empty" style="margin-top:40px">Firebase를 불러오지 못했어요.<br>${esc(err.message)}</div>`; return; }
  store.onAuth(u => {
    user = u; ready = false;
    if (!u) { projects = []; renderLogin(); return; }
    store.listen(onData);
  });
})();
</script>
</body>
</html>
