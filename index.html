<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e3e6eb">
<title>미디어볼 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
==================== 설정 방법 ====================
Firebase 규칙 (Firestore > 규칙):

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /projects/{id} {
      allow read, write: if request.auth != null
                         && request.auth.token.email == "본인@gmail.com";
    }
  }
}

FIREBASE_CONFIG를 비워두면 '체험 모드'로 동작합니다 (이 브라우저에만 저장).
색 바꾸기: 아래 :root 의 --brand(파랑), --sun(노랑) 값만 바꾸면 전체 색이 바뀝니다.
=====================================================
-->
<style>
:root{
  color-scheme:light;
  --bg:#e3e6eb; --panel:#f2f4f7; --ink:#1b1f24; --mu:#58616b; --line:#c9cfd6; --soft:#d6dae0;
  --brand:#3552d1; --sun:#ffd43b; --coral:#ff6b57; --teal:#12a594; --violet:#7950f2;
  --danger:#b3261e;
  --s-pre:#7b838c; --s-prod:#2f6fd0; --s-post:#d99a00; --s-done:#2a8a63;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --num:"Archivo","Pretendard Variable",Pretendard,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:1120px;margin:0 auto;padding:0 20px calc(48px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--mu);font-size:13px}

/* 상단 내비 */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo img{height:56px;width:auto;flex:none;display:block}
.login .logo img{height:84px}
.logo b{font-family:var(--num);font-stretch:125%;font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.acts{display:flex;gap:8px;flex:none}
.btn{border:0;background:var(--sun);color:#1b1f24;border-radius:10px;padding:9px 15px;font-weight:700;white-space:nowrap}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;white-space:nowrap}
.sm{font-size:13px;padding:8px 11px;color:var(--mu)}
.danger{color:var(--danger)}
.banner{background:var(--soft);color:var(--mu);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 14px}

/* 클래퍼보드 줄무늬 */
.clap{height:22px;background:repeating-linear-gradient(-45deg,#14181c 0 16px,#f2f4f7 16px 32px)}
.clap.sm{height:10px;border-radius:5px;margin-bottom:14px}

/* 회사명(히어로 밖) */
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px}
.page-name{margin:0;font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.titlerow select{width:auto}

/* 히어로 */
.hero{background:var(--brand);color:#fff;border-radius:20px;overflow:hidden;margin-bottom:34px}
.hero-body{padding:24px 28px 26px}
.hero-kpi{display:grid;grid-template-columns:.75fr 1fr 1fr 1fr;gap:12px}
@media (max-width:1000px) and (min-width:761px){.hero-kpi{grid-template-columns:1fr 1fr}}
.hk{background:rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;min-width:0}
.hk.main{grid-column:1/-1;background:rgba(255,255,255,.18);padding:20px 22px;display:flex;gap:28px;align-items:stretch;justify-content:space-between}
.mtot{flex:1;min-width:0}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:none;width:min(50%,460px)}
.hf{background:rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.hk .l{display:block;font-size:13px;color:rgba(255,255,255,.86);margin-bottom:10px}
.hk .big{display:block;font-family:var(--num);font-stretch:112%;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(38px,7vw,68px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.hk .v{display:block;font-family:var(--num);font-stretch:108%;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(22px,3vw,30px);line-height:1.1;letter-spacing:-.02em;white-space:nowrap}
.hk em{font-style:normal;font-family:var(--sans);font-stretch:100%;font-weight:600;color:rgba(255,255,255,.82);margin-left:.18em}
.hk .big em{font-size:.3em}
.hk .v em{font-size:.55em}
.hk .s{display:block;font-size:13px;color:rgba(255,255,255,.86);margin-top:10px}
.hf .v{font-size:clamp(20px,2.1vw,24px)}
.hf .l{margin-bottom:8px}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.22);margin:22px 0 10px}
.sbar i{display:block;height:100%}
.sbar.cat{margin:18px 0 10px}
.hero .cc0{background:#ffffff}.hero .cc1{background:#ff8a78}.hero .cc2{background:#b69cff}.hero .ccn{background:#8f9bc4}
.legend.cat{margin-top:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:rgba(255,255,255,.92)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-진행중{background:var(--s-prod)}.d-완료{background:var(--s-done)}
.hero .d-진행중{background:#ffd43b}.hero .d-완료{background:#5ee0a8}

/* 하이라이트 */
.hl{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:24px;margin-bottom:38px}
.sec h3,.sec-h h3{margin:0 0 12px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:14px;border-top:4px solid var(--c);padding:14px 16px;text-decoration:none;color:inherit;min-width:0}
.pcard:hover{background:#fafbfc}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--mu)}
.pc-st{display:inline-flex;align-items:center;gap:6px}
.pc-n{font-weight:700;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.pc-f{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu)}
.dd{font-family:var(--num);font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.dd.soon{background:var(--sun)}
.dd.late{background:var(--coral);color:#fff}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.box{background:var(--panel);border-radius:14px;padding:16px 18px}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-size:14px}
.up.first{border-top:0}
.up span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.up .r{display:flex;align-items:center;gap:8px;flex:none;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mu)}

/* 전체 프로젝트 */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h3{margin:0}
.tabs{display:flex;gap:6px;margin:0 0 18px;overflow-x:auto}
.sec-h .tabs{margin:0}
.tabs a,.tabs button{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);text-decoration:none;white-space:nowrap;font-size:14px;font-weight:500}
.tabs .on{background:var(--brand);border-color:var(--brand);color:#fff}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1;min-width:150px;max-width:240px}
@media (max-width:760px){.filters input[type=search]{max-width:none}}
.filters select{width:auto}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);white-space:nowrap}
.filters input[type=checkbox]{width:auto}
.tbl{background:var(--panel);border-radius:14px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:5.4rem minmax(0,1fr) 4.8rem 7rem 5.4rem 7.8rem 5.2rem;column-gap:12px;align-items:center;padding:0 20px}
.lh{height:40px;background:var(--soft);font-size:12.5px;color:var(--mu)}
.row{min-height:56px;padding-top:12px;padding-bottom:12px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.lh+.row{border-top:0}
.row:hover{background:#fafbfc}
.m,.m2{display:contents}
.cd{display:none}
.c-n{order:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-cat{order:2}
.c-s{order:3;display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.c-start{order:0}.c-due{order:4}
.c-start,.c-due{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu)}
.c-set{order:6;text-align:right}
.stb{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;line-height:1.5;white-space:nowrap}
.stb.ok{background:#cdeee8;color:#0b7a6c}.stb.un{background:#fbdcd7;color:#b0382a}
.c-amt{order:5;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px}
.lh .hd-7,.lh .hd-8{text-align:right}
.c::before{display:none}
.hd-5{order:0}.hd-1{order:1}.hd-2{order:2}.hd-3{order:3}.hd-6{order:4}.hd-7{order:5}.hd-8{order:6}

/* 카테고리 태그 */
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.t0{background:#dde2f7;color:#2a43ad}
.t1{background:#fbdcd7;color:#b0382a}
.t2{background:#cdeee8;color:#0b7a6c}
.pc-m{min-height:1.6em}

/* iOS 입력 시 자동 확대 방지: 입력창 글자 16px 이상 */
@media (max-width:900px){input,select,textarea{font-size:16px!important}}

/* 세금 */
.tx-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.tx-card{background:var(--panel);border-radius:16px;padding:20px 22px;border-top:4px solid var(--brand)}
.tx-card.h2{border-top-color:var(--sun)}
.tx-card h3{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--mu)}
.tx-card h3 b{color:var(--ink);font-size:17px;margin-right:6px}
.tx-vat{font-family:var(--num);font-size:clamp(28px,3.4vw,38px);font-weight:700;white-space:nowrap;line-height:1.1}
.tx-vat small{font-size:14px;font-weight:500;color:var(--mu);margin-left:4px}
.tx-lbl{font-size:13px;color:var(--mu);margin-bottom:6px}
.tx-sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.tx-sub small{display:block;font-size:12.5px;color:var(--mu);margin-bottom:3px}
.tx-sub b{font-family:var(--num);font-size:15px;white-space:nowrap}
.tx-sec{margin:0 0 26px}
.tx-sec h3{margin:0 0 12px;font-size:17px}
.tx-r{display:grid;grid-template-columns:4rem repeat(3,minmax(0,1fr)) 3.5rem;column-gap:14px;align-items:center;padding:0 20px;min-height:48px;border-top:1px solid var(--line);list-style:none;cursor:pointer}
.tx-h{height:40px;background:var(--soft);font-size:12.5px;color:var(--mu);cursor:default;border-top:0}
.tx-r.tx-h span:nth-child(n+2),.tx-r .num{text-align:right}
.tx-r .mo{font-weight:700}
.tx-r .num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px}
.tx-r .num.zero{color:var(--mu);opacity:.6}
.tx-r .num.v{font-weight:700;color:var(--brand)}
.tx-r::-webkit-details-marker{display:none}
.tx-r:not(.tx-h):hover{background:#fafbfc}
.tx-t{background:var(--soft);font-weight:700;cursor:default}
.tx-d{background:#fafbfc;border-top:1px solid var(--line);padding:6px 20px 10px}
.tx-d a{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;text-decoration:none;color:inherit;font-size:14px;border-top:1px dashed var(--line)}
.tx-d a:first-child{border-top:0}
.tx-d .amt{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:16px}
.tx-d .amt em{font-style:normal;color:var(--brand);font-weight:700}
.tx-d .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-note{font-size:13px;color:var(--mu);line-height:1.6;margin:0 0 6px}
@media (max-width:760px){
  .tx-cards{grid-template-columns:1fr;gap:10px}
  .tx-r{grid-template-columns:3rem minmax(0,1fr) minmax(0,1fr);padding:0 16px;column-gap:10px}
  .tx-r .tot,.tx-r .cnt{display:none}
  .tx-h span:nth-child(4),.tx-h span:nth-child(5){display:none}
  .tx-d{padding:4px 16px 8px}
  .tx-d a{font-size:13.5px;gap:10px}
  .tx-d .amt{flex-direction:column;gap:0;align-items:flex-end}
  .tx-d .amt span{color:var(--mu);font-size:12.5px;order:2}
}

/* 빠른 추가 */
.qa{background:var(--panel);border-radius:14px;padding:14px 16px;margin:0 0 30px;display:grid;grid-template-columns:minmax(0,1fr) 7rem 7rem 9.5rem 7rem auto;gap:10px;align-items:end}
.qa label{display:block;font-size:12.5px;color:var(--mu)}
.qa label input,.qa label select{margin-top:5px}
.qa .btn{height:42px}
.qa-t{grid-column:1/-1;margin:0;font-size:15px;font-weight:700}
@media (max-width:760px){
  .qa{grid-template-columns:1fr 1fr;padding:14px}
  .qa .nm,.qa .btn{grid-column:1/-1}
}

/* 월별보기 */
.vtabs{display:flex;gap:6px;margin:0 0 20px;border-bottom:1px solid var(--line)}
.vtabs a{padding:10px 18px;text-decoration:none;color:var(--mu);font-size:15px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.vtabs a.on{color:var(--brand);border-bottom-color:var(--brand)}
.mv-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.mv-h h2{margin:0;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.mv-h select{width:auto}
.mv-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.mv-sum div{background:var(--panel);border-radius:14px;padding:16px 18px}
.mv-sum small{display:block;color:var(--mu);font-size:13px;margin-bottom:6px}
.mv-sum b{font-family:var(--num);font-size:clamp(20px,2.4vw,26px);white-space:nowrap}
.mv-sum .warn b{color:var(--coral)}
.mtbl{background:var(--panel);border-radius:14px;overflow:hidden}
.mh,.mr{display:grid;grid-template-columns:4rem minmax(80px,1fr) 8.5rem 8.5rem 3.5rem;column-gap:14px;align-items:center;padding:0 20px}
.mh{height:40px;background:var(--soft);font-size:12.5px;color:var(--mu)}
.mh span:nth-child(n+3),.mr .num{text-align:right}
.mr{min-height:52px;border-top:1px solid var(--line);cursor:pointer;list-style:none}
.mh+details>.mr{border-top:0}
.mr::-webkit-details-marker{display:none}
.mr:hover{background:#fafbfc}
.mr .mo{font-weight:700}
.mr .num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14px}
.mr .num.un{color:var(--coral);font-weight:600}
.mr .num.zero{color:var(--mu);opacity:.6}
.mbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mbar .r{background:var(--brand)}.mbar .u{background:var(--coral)}
.mdet{background:#fafbfc;border-top:1px solid var(--line);padding:6px 20px 10px}
.mdet a{display:grid;grid-template-columns:minmax(0,1fr) 8.5rem 8.5rem 3.5rem;column-gap:14px;padding:9px 0;text-decoration:none;color:inherit;font-size:14px;border-top:1px dashed var(--line)}
.mdet a:first-child{border-top:0}
.mdet a span:nth-child(n+2){text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.mdet .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mt{background:var(--soft);font-weight:700}
.mt.mr{cursor:default}
.mt.mr:hover{background:var(--soft)}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--mu);margin:0 0 10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.unl{margin-top:30px}
.unl h3{margin:0 0 12px;font-size:17px}
.unl .mtbl a{display:grid;grid-template-columns:minmax(0,1fr) 8.5rem 8.5rem;column-gap:14px;padding:13px 20px;text-decoration:none;color:inherit;border-top:1px solid var(--line);font-size:14px}
.unl .mtbl a:first-child{border-top:0}
.unl .mtbl a span:nth-child(n+2){text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .mv-sum{grid-template-columns:1fr;gap:8px}
  .mv-sum div{display:flex;justify-content:space-between;align-items:baseline;padding:13px 16px}
  .mv-sum small{margin:0}
  .mh{display:none}
  .mr{grid-template-columns:2.6rem 1fr 6.4rem;padding:12px 16px;row-gap:8px;column-gap:8px}
  .mr>*{grid-row:1}
  .mr .mo{grid-column:1}
  .mr>.num:nth-child(3){grid-column:2}
  .mr>.num:nth-child(4){grid-column:3}
  .mr .mbc{grid-column:1/-1;grid-row:2}
  .mr .cnt{display:none}
  .mt span:nth-child(2){display:none}
  .mt.mr{padding:14px 16px}
  .mdet{padding:4px 16px 8px}
  .mdet a{grid-template-columns:minmax(0,1fr) auto 6.4rem;column-gap:8px}
  .mdet a span:nth-child(4){display:none}
  .unl .mtbl a{grid-template-columns:minmax(0,1fr) auto;padding:12px 16px}
  .unl .mtbl a span:nth-child(2){display:none}
}

/* 보드 */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{flex:1 0 250px;min-width:250px;background:var(--soft);border-radius:14px;padding:12px}
.col h3{margin:2px 4px 12px;font-size:14px;display:flex;align-items:center;gap:8px;font-weight:600}
.col.over{outline:2px dashed var(--brand)}
.kcard{display:block;background:var(--panel);border-radius:10px;padding:11px 13px;margin-bottom:8px;text-decoration:none;color:inherit}
.kcard b{display:block;margin-bottom:3px;font-weight:600}
.kcard small{color:var(--mu);font-size:12.5px}
.empty{text-align:center;padding:36px 12px;color:var(--mu);border:1px dashed var(--line);border-radius:14px}

/* 푸터 */
.foot{margin-top:48px;text-align:center;color:var(--mu);font-size:13px}

/* 상세 */
.bar{display:flex;align-items:center;gap:10px;padding:18px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.title{font-size:21px;font-weight:700;border:0;background:transparent;padding:6px 4px;letter-spacing:-.01em}
.metarow{display:flex;gap:8px;margin-bottom:14px}
.metarow select{flex:0 0 auto;width:auto;min-width:170px}
.pane{background:var(--panel);border-radius:14px;padding:16px}
textarea.notes{min-height:52vh;resize:vertical;line-height:1.75;border:0;padding:2px;background:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label.f{display:block;font-size:12.5px;color:var(--mu)}
label.f input,label.f textarea{margin-top:5px;color:var(--ink);font-size:15px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.sum div{background:var(--soft);border-radius:12px;padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.sum small{display:block;color:var(--mu);font-size:12.5px}
.sum b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16px}
h4{margin:18px 0 8px;font-size:14px;font-weight:600}
.ps+.ps{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.sh{margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.erow{display:grid;grid-template-columns:1fr 140px 38px;gap:6px;margin-bottom:6px}
.lrow{display:grid;grid-template-columns:130px 1fr 38px 38px;gap:6px;margin-bottom:6px}
.x{border:1px solid var(--line);background:var(--panel);border-radius:10px}
.login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.login h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}

/* 모바일 */
@media(max-width:860px){
  .hl{grid-template-columns:1fr}
}
@media(max-width:760px){
  #app{padding:0 16px calc(40px + env(safe-area-inset-bottom))}
  .nav{padding:12px 0}
  .hero{border-radius:16px;margin-bottom:28px}
  .hero-body{padding:18px 16px 20px}
  .hero-kpi{grid-template-columns:1fr;gap:8px}
  .hk{padding:12px 14px}
  .hk.main{padding:16px 16px;flex-direction:column;gap:14px}
  .halves{width:100%;grid-template-columns:1fr;gap:8px}
  .hf{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline;padding:12px 14px}
  .hf .l{margin:0}
  .hf .v{text-align:right;font-size:20px}
  .hf .s{grid-column:1/-1;margin-top:2px}
  .hk:not(.main){display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:baseline}
  .hk:not(.main) .l{margin:0}
  .hk:not(.main) .v{text-align:right;font-size:20px}
  .hk:not(.main) .s{grid-column:1/-1;margin-top:2px}
  .sec-h{flex-direction:column;align-items:flex-start}
  .lh{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto auto;row-gap:6px;column-gap:10px;padding:14px 16px;align-items:center}
  .m{display:contents}
  .c-cat{display:none}
  .c-n{order:0;grid-column:1;grid-row:1;font-size:16px}
  .cd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;vertical-align:1px;flex:none}
  .cdn{background:transparent}.cd0{background:#3552d1}.cd1{background:#ff6b57}.cd2{background:#12a594}
  .c-set{order:1;grid-column:2;grid-row:1;text-align:right}
  .c-s{order:2;grid-column:3;grid-row:1;font-weight:600;font-size:13.5px;width:3.6em;text-align:right;justify-content:flex-end}
  .m2{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding-left:19px;grid-column:1/-1;grid-row:2;order:3;font-size:12.5px;color:var(--mu)}
  .m2 .c{order:1}
  .st-진행중{color:var(--brand)}.st-완료{color:var(--mu)}
  .c-s .dot,.c-s::before{display:none}
  .c::before{display:inline;content:attr(data-l) " ";color:var(--mu);opacity:.8}
  .c-cat::before,.c-amt::before,.c-set::before,.c-s::before,.c-n::before{content:""}
  .c.e{display:none}
  .c-amt{text-align:left;font-size:12.5px;color:var(--ink);font-weight:600}
  .grid4{grid-template-columns:1fr 1fr}
  .lrow{grid-template-columns:1fr 38px 38px}
  .lrow input:first-child{grid-column:1/-1}
  .erow{grid-template-columns:1fr 112px 38px}
  .sum b{font-size:14px}
  .sum div{padding:10px}
  .col{flex-basis:78vw;min-width:78vw}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = n => (Number(n) || 0).toLocaleString("ko-KR");
const won = n => nf(n) + "원";
const money = n => n >= 1e8 ? `${(n / 1e8).toFixed(2).replace(/\.?0+$/, "")}<em>억원</em>` : `${nf(n)}<em>원</em>`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const ymd = d => { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const todayStr = () => ymd(new Date());
const dt = d => d ? d.slice(2).replace(/-/g, ".") : "";            // 2026-01-05 → 26.01.05
const regOf = p => p.registered || (p.createdAt ? ymd(new Date(p.createdAt)) : "");
const yearOf = p => +((p.start || p.due || regOf(p) || String(CUR)).slice(0, 4));
const daysTo = d => d ? Math.round((new Date(d + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000) : null;

/* ================= 저장소 ================= */
function localStore() {
  const LK = "bowl_projects_v1";
  let arr = JSON.parse(localStorage.getItem(LK) || "[]"), cb = () => {};
  const commit = () => { localStorage.setItem(LK, JSON.stringify(arr)); cb([...arr]); };
  return {
    mode: "local",
    onAuth(f) { f({ email: "체험 모드" }); },
    listen(f) { cb = f; f([...arr]); },
    async save(p) { const i = arr.findIndex(x => x.id === p.id); i < 0 ? arr.push(p) : (arr[i] = p); commit(); },
    async remove(id) { arr = arr.filter(x => x.id !== id); commit(); },
    async seed(items) { arr.push(...items); commit(); },
    signIn() {}, signOut() {}
  };
}

async function firebaseStore() {
  const B = "https://www.gstatic.com/firebasejs/10.14.1/";
  const [A, Au, Fs] = await Promise.all([
    import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")
  ]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app);
  const db = Fs.initializeFirestore(app, { localCache: Fs.persistentLocalCache() });
  const col = Fs.collection(db, "projects");
  let unsub = null;
  return {
    mode: "firebase",
    onAuth(f) {
      Au.onAuthStateChanged(auth, u => {
        if (u && ALLOWED_EMAIL && u.email !== ALLOWED_EMAIL) { Au.signOut(auth); alert("허용되지 않은 계정이에요."); return; }
        if (!u && unsub) { unsub(); unsub = null; }
        f(u);
      });
    },
    listen(f) { if (unsub) unsub(); unsub = Fs.onSnapshot(col, s => f(s.docs.map(d => ({ ...d.data(), id: d.id })))); },
    save: p => Fs.setDoc(Fs.doc(db, "projects", p.id), p),
    remove: id => Fs.deleteDoc(Fs.doc(db, "projects", id)),
    async seed(items) { const b = Fs.writeBatch(db); items.forEach(p => b.set(Fs.doc(db, "projects", p.id), p)); await b.commit(); },
    signIn: () => Au.signInWithPopup(auth, new Au.GoogleAuthProvider()),
    signOut: () => Au.signOut(auth)
  };
}

const pending = new Map();

function persist(p) {
  p.updatedAt = Date.now();
  pending.set(p.id, p);
  const s = $("#saved"); if (s) s.textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
function flush() {
  clearTimeout(saveTimer);
  pending.forEach(p => store.save(p));
  pending.clear();
  const s = $("#saved"); if (s) s.textContent = "저장됨";
}
addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
addEventListener("pagehide", flush);

  const sum = ps => ({ c: ps.reduce((t, p) => t + (Number(p.contract) || 0), 0), v: ps.reduce((t, p) => t + vat(p), 0), n: ps.length });
  const z = v => v ? won(v) : "–";
  const halves = [{ k: "h1", name: "상반기", lab: "1~6월", from: 1, to: 6 }, { k: "h2", name: "하반기", lab: "7~12월", from: 7, to: 12 }].map(h => {
    const ps = yp.filter(p => mOf(p) >= h.from && mOf(p) <= h.to);
    const months = Array.from({ length: h.to - h.from + 1 }, (_, i) => { const m = h.from + i, mp = ps.filter(p => mOf(p) === m).sort(byDate); return { m, ps: mp, ...sum(mp) }; });
    return { ...h, ps, ...sum(ps), months };
  });
  const all = sum(yp);
  return `
  <div class="mv-h"><h2>${yr}년 부가세</h2>
    <select id="fyear" aria-label="연도">${years.map(y => `<option value="${y}" ${yr === y ? "selected" : ""}>${y}년</option>`).join("")}</select></div>
  <p class="tx-note">계약금액(버짓)은 부가세 별도 기준이라 부가세는 계약금액의 10%로 계산해요. 프로젝트의 시작일(없으면 납기, 등록일) 기준으로 월을 나눠요.</p>
  <div class="tx-cards" style="margin-top:16px">
    ${halves.map(h => `<div class="tx-card ${h.k}">
      <h3><b>${h.name}</b>${h.lab} · ${h.n}건</h3>
      <div class="tx-lbl">부가세 (10%)</div>
      <div class="tx-vat">${nf(h.v)}<small>원</small></div>
      <div class="tx-sub"><div><small>공급가액 (계약금액)</small><b>${won(h.c)}</b></div><div><small>합계 (부가세 포함)</small><b>${won(h.c + h.v)}</b></div></div>
    </div>`).join("")}
  </div>
  ${halves.map(h => `<section class="tx-sec"><h3>${h.name} ${h.lab}</h3>
    <div class="mtbl">
      <div class="tx-r tx-h"><span>월</span><span>공급가액</span><span>부가세</span><span class="tot">합계</span><span class="cnt">건수</span></div>
      ${h.months.map(r => `<details><summary class="tx-r"><span class="mo">${r.m}월</span><span class="num ${r.c ? "" : "zero"}">${z(r.c)}</span><span class="num v ${r.v ? "" : "zero"}">${z(r.v)}</span><span class="num tot ${r.c ? "" : "zero"}">${z(r.c + r.v)}</span><span class="num cnt ${r.n ? "" : "zero"}">${r.n || "–"}</span></summary>
        ${r.ps.length ? `<div class="tx-d">${r.ps.map(p => `<a href="#/p/${p.id}"><span class="nm">${esc(p.name)}</span><span class="amt"><span>${won(Number(p.contract))}</span><em>부가세 ${won(vat(p))}</em></span></a>`).join("")}</div>` : ""}
      </details>`).join("")}
      <div class="tx-r tx-t"><span class="mo">소계</span><span class="num">${won(h.c)}</span><span class="num v">${won(h.v)}</span><span class="num tot">${won(h.c + h.v)}</span><span class="num cnt">${h.n}</span></div>
    </div></section>`).join("")}
  <p class="tx-note">연간 합계: 공급가액 ${won(all.c)} · 부가세 ${won(all.v)} · 합계 ${won(all.c + all.v)}</p>`;
}
function monthlyHTML() {
  const years = [...new Set([...projects.map(yearOf), CUR])].sort((a, b) => b - a);
  const yr = F.year || CUR;
  const yp = projects.filter(p => yearOf(p) === yr);
  const mOf = p => +((p.start || p.due || regOf(p) || "").slice(5, 7)) || 0;
  const num = v => Number(v) || 0;
  const rows = Array.from({ length: 12 }, (_, i) => {
    const ps = yp.filter(p => mOf(p) === i + 1).sort(byDate);
    return { m: i + 1, ps, c: ps.reduce((t, p) => t + num(p.contract), 0), r: ps.reduce((t, p) => t + num(p.received), 0), u: ps.reduce((t, p) => t + unpaid(p), 0) };
  });
  const tot = rows.reduce((t, r) => ({ c: t.c + r.c, r: t.r + r.r, u: t.u + r.u, n: t.n + r.ps.length }), { c: 0, r: 0, u: 0, n: 0 });
  const mx = Math.max(1, ...rows.map(r => r.c));
  const z = v => v ? won(v) : "–";
  const unList = yp.filter(p => unpaid(p) > 0 && num(p.contract) > 0).sort((a, b) => unpaid(b) - unpaid(a));
  return `
  <div class="mv-h"><h2>${yr}년 월별 매출</h2>
    <select id="fyear" aria-label="연도">${years.map(y => `<option value="${y}" ${yr === y ? "selected" : ""}>${y}년</option>`).join("")}</select></div>
  <div class="mv-sum" style="grid-template-columns:repeat(2,1fr)"><div><small>연 매출 (계약금액)</small><b>${won(tot.c)}</b></div>
    <div class="${tot.u ? "warn" : ""}"><small>미수금</small><b>${won(tot.u)}</b></div></div>
  <div class="leg"><span><i style="background:var(--brand)"></i>계약금액</span><span><i style="background:var(--coral)"></i>미수</span><span>기준월: 시작일 → 납기 → 등록일</span></div>
  <div class="mtbl">
    <div class="mh"><span>월</span><span>매출 비중</span><span>계약금액</span><span>미수</span><span>건수</span></div>
    ${rows.map(r => `<details><summary class="mr"><span class="mo">${r.m}월</span>
      <span class="mbc" style="grid-column:2"><span class="mbar" style="width:${Math.round(r.c / mx * 100)}%;min-width:${r.c ? 4 : 0}px">${r.c ? `<i class="r" style="width:${100 - Math.round(Math.min(r.u, r.c) / r.c * 100)}%"></i><i class="u" style="flex:1"></i>` : ""}</span></span>
      <span class="num ${r.c ? "" : "zero"}">${z(r.c)}</span><span class="num ${r.u ? "un" : "zero"}">${z(r.u)}</span><span class="num cnt ${r.ps.length ? "" : "zero"}">${r.ps.length || "–"}</span></summary>
      ${r.ps.length ? `<div class="mdet">${r.ps.map(p => `<a href="#/p/${p.id}"><span class="nm">${esc(p.name)}</span><span>${z(num(p.contract))}</span><span style="${unpaid(p) ? "color:var(--coral)" : ""}">${z(unpaid(p))}</span><span></span></a>`).join("")}</div>` : ""}
    </details>`).join("")}
    <div class="mr mt"><span class="mo">합계</span><span></span><span class="num">${won(tot.c)}</span><span class="num ${tot.u ? "un" : ""}">${won(tot.u)}</span><span class="num cnt">${tot.n}</span></div>
  </div>
  <section class="unl"><h3>미수금 있는 프로젝트 ${unList.length}건</h3>
    ${unList.length ? `<div class="mtbl">${unList.map(p => `<a href="#/p/${p.id}"><span class="nm" style="font-weight:600">${esc(p.name)}</span><span>${won(num(p.contract))}</span><span style="color:var(--coral);font-weight:600">${won(unpaid(p))}</span></a>`).join("")}</div>` : `<div class="empty" style="padding:24px">미수금이 없어요.</div>`}
  </section>`;
}

const monthOfP = p => +((p.start || p.due || regOf(p) || "").slice(5, 7)) || 0;
const inHalf = p => { if (F.h1 === F.h2) return true; const m = monthOfP(p); return F.h1 ? m >= 1 && m <= 6 : m >= 7; };
const inYear = p => !F.year || yearOf(p) === F.year;
function filtered() {
  const q = F.q.toLowerCase();
  return projects.filter(p =>
    inYear(p) && inHalf(p) &&
    (!F.hideDone || p.status !== "완료") &&
    (!F.cat || catOf(p) === F.cat) &&
    (!q || p.name.toLowerCase().includes(q)));
}
const byDate = (a, b) => (a.start || a.due || regOf(a) || "9999").localeCompare(b.start || b.due || regOf(b) || "9999");

function renderStats() {
  const el = $("#stats"); if (!el) return;
  const years = [...new Set([...projects.map(yearOf), CUR])].sort((a, b) => b - a);
  const yp = projects.filter(inYear);
  const n = s => yp.filter(p => p.status === s).length;
  const revenue = yp.reduce((a, p) => a + (Number(p.contract) || 0), 0);
  const received = yp.reduce((a, p) => a + (Number(p.received) || 0), 0);
  const unp = yp.reduce((a, p) => a + unpaid(p), 0);
  const doneU = yp.filter(p => p.status === "완료" && unpaid(p) > 0 && Number(p.contract) > 0);
  const ingU = yp.filter(p => p.status === "진행중" && unpaid(p) > 0 && Number(p.contract) > 0);
  const arDone = doneU.reduce((a, p) => a + unpaid(p), 0), arDoneN = doneU.length;
  const arIng = ingU.reduce((a, p) => a + unpaid(p), 0), arIngN = ingU.length;
  const mar = yp.filter(p => Number(p.contract) > 0).reduce((a, p) => a + margin(p), 0);
  const marPct = revenue ? Math.round(mar / revenue * 100) : null;
  const rcvPct = revenue ? Math.round(received / revenue * 100) : null;
  const label = F.year ? `${F.year} 누적 매출` : "전체 누적 매출";
  const monthOf = p => +((p.start || p.due || regOf(p) || "").slice(5, 7)) || 0;
  const h1 = yp.filter(p => monthOf(p) >= 1 && monthOf(p) <= 6);
  const h2 = yp.filter(p => monthOf(p) >= 7);
  const sumC = a => a.reduce((t, p) => t + (Number(p.contract) || 0), 0);
  const total = yp.length;
  const active = n("진행중");
  const order = ["진행중", "완료"];
  const cats = [...CATS.map((name, k) => ({ name, k, n: yp.filter(p => catOf(p) === name).length })), { name: "미분류", k: "n", n: yp.filter(p => !catOf(p)).length }];

  el.innerHTML = `
  <div class="titlerow">
    <h2 class="page-name">${COMPANY}</h2>
    <select id="fyear" aria-label="연도"><option value="0" ${F.year === 0 ? "selected" : ""}>전체 연도</option>${years.map(y => `<option value="${y}" ${F.year === y ? "selected" : ""}>${y}년</option>`).join("")}</select>
  </div>
  <section class="hero">
    <div class="clap" aria-hidden="true"></div>
    <div class="hero-body">
      <div class="hero-kpi">
        <div class="hk main">
          <div class="mtot"><span class="l">${label}</span>
            <b class="big">${money(revenue)}</b>
            <span class="s">${revenue ? `입금 ${won(received)}` : "프로젝트의 계약금액을 입력하면 집계돼요"}</span></div>
          ${F.year ? `<div class="halves">
            <div class="hf"><span class="l">상반기 1~6월</span><b class="v">${money(sumC(h1))}</b><span class="s">${h1.length}건</span></div>
            <div class="hf"><span class="l">하반기 7~12월</span><b class="v">${money(sumC(h2))}</b><span class="s">${h2.length}건</span></div></div>` : ""}
        </div>
        <div class="hk"><span class="l">프로젝트</span><b class="v">${total}<em>건</em></b><span class="s">진행 중 ${active}건</span></div>
        <div class="hk"><span class="l">미수금 · 완료</span><b class="v">${money(arDone)}</b><span class="s">${arDoneN ? `${arDoneN}건 못 받음` : "없음"}</span></div>
        <div class="hk"><span class="l">입금예정 · 진행중</span><b class="v">${money(arIng)}</b><span class="s">${arIngN ? `${arIngN}건 남음` : "없음"}</span></div>
        <div class="hk"><span class="l">마진</span><b class="v">${money(mar)}</b><span class="s">${marPct === null ? "-" : `마진율 ${marPct}%`}</span></div>
      </div>
      <div class="sbar" role="img" aria-label="상태별 프로젝트 비율">${total ? order.map(s => n(s) ? `<i class="d-${s}" style="width:${n(s) / total * 100}%"></i>` : "").join("") : ""}</div>
      <div class="legend">${order.map(s => `<span><i class="dot d-${s}"></i>${s} ${n(s)}</span>`).join("")}</div>
      ${total ? `<div class="sbar cat" role="img" aria-label="카테고리별 프로젝트 비율">${cats.map(c => c.n ? `<i class="cc${c.k}" style="width:${c.n / total * 100}%"></i>` : "").join("")}</div>
      <div class="legend cat">${cats.map(c => c.n ? `<span><i class="dot cc${c.k}"></i>${c.name} ${c.n}건 (${Math.round(c.n / total * 100)}%)</span>` : "").join("")}</div>` : ""}
    </div>
  </section>`;
}

function renderHighlights() {
  const el = $("#hl"); if (!el) return;
  if (location.hash === "#/board" || !projects.length) { el.innerHTML = ""; return; }
  const yp = projects.filter(inYear);
  const act = yp.filter(p => p.status === "진행중").sort(byDate).slice(0, 6);
  const today = todayStr();
  const up = yp.filter(p => p.due && p.due >= today && p.status !== "완료").sort((a, b) => a.due.localeCompare(b.due)).slice(0, 5);

  const card = p => { const d = daysTo(p.due); return `<a class="pcard" href="#/p/${p.id}" style="--c:${SCOLOR[p.status]}">
    <span class="pc-top"><span class="pc-st"><i class="dot d-${p.status}"></i>${p.status}</span>${d !== null ? `<span class="dd ${ddClass(d)}">${dday(d)}</span>` : ""}</span>
    <b class="pc-n">${esc(p.name)}</b>
    <span class="pc-m">${tag(catOf(p))}</span>
    <span class="pc-f"><span>${p.start ? "시작 " + dt(p.start) : ""}</span><span>${Number(p.contract) ? won(p.contract) : ""}</span></span></a>`; };

  el.innerHTML = `<div class="hl">
    <section class="sec"><h3>진행 중인 프로젝트</h3>
      ${act.length ? `<div class="pgrid">${act.map(card).join("")}</div>` : `<div class="empty">진행 중인 프로젝트가 없어요.</div>`}</section>
    <aside class="side">
      <section class="box sec"><h3>다가오는 납기</h3>
        ${up.length ? up.map((p, i) => { const d = daysTo(p.due); return `<a class="up${i ? "" : " first"}" href="#/p/${p.id}"><span>${esc(p.name)}</span><span class="r">${dt(p.due)}<span class="dd ${ddClass(d)}">${dday(d)}</span></span></a>`; }).join("")
          : `<p class="muted" style="margin:0">납기일을 입력하면 여기에 모여요.</p>`}</section>
    </aside></div>`;
}

          <span class="m2">

        </span></a>`).join("")}</div>`;
  }
}

    <span id="saved" class="muted"></span></div>
  <nav class="tabs">
    ${[["main", "버짓·정보"], ["notes", "노트"]].map(([k, l]) => `<button data-act="tab" data-t="${k}" class="${detailTab === k ? "on" : ""}">${l}</button>`).join("")}
  </nav>
  <div class="pane" id="pane"></div>`;
  renderPane(p);
}

const k = v => (v === "" || v == null) ? "" : String(Math.round(Number(v)) / 10000);
function renderPane(p) {
  const el = $("#pane"); if (!el) return;
  document.querySelectorAll('[data-act="tab"]').forEach(b => b.classList.toggle("on", b.dataset.t === detailTab));
  if (detailTab === "notes") {
    el.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button class="ghost sm" data-act="today">+ 오늘 날짜</button></div>
    <textarea class="notes" id="notes" data-f="notes" placeholder="미팅 기록, 콘티 아이디어, 클라이언트 피드백">${esc(p.notes)}</textarea>`;
  } else {
    el.innerHTML = `
    <section class="ps"><h3 class="sh">버짓</h3>
      <div class="grid2">
        <label class="f">계약금액(만원)<input type="number" step="any" inputmode="decimal" placeholder="예: 275.3 → 275만 3천원" data-f="contract" value="${k(p.contract)}"></label>
        <label class="f">입금액(만원)<input type="number" step="any" inputmode="decimal" placeholder="예: 275.3 → 275만 3천원" data-f="received" value="${k(p.received)}"></label></div>
      <div class="sum"><div><small>지출 합계</small><b id="b-exp"></b></div><div><small>마진</small><b id="b-margin"></b></div><div><small>미수금</small><b id="b-unpaid"></b></div></div>
      <h4>지출 항목</h4><div id="exp"></div>
      <datalist id="exl"><option value="외주비"><option value="장비 렌탈"><option value="출장비"><option value="식비"><option value="인건비"><option value="음악·폰트 라이선스"><option value="기타"></datalist>
      <button class="ghost" data-act="addExp">+ 지출 추가</button></section>
    <section class="ps"><h3 class="sh">정보·링크</h3>
      <div class="grid2" style="margin-bottom:12px">
        <label class="f">상태<select data-f="status">${STATUSES.map(s => `<option ${p.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
        <label class="f">카테고리<select data-f="category"><option value="">없음</option>${CATS.map(c => `<option ${catOf(p) === c ? "selected" : ""}>${c}</option>`).join("")}</select></label></div>
      <div class="grid4">
        <label class="f">등록일<input type="date" data-f="registered" value="${esc(regOf(p))}"></label>
        <label class="f">시작일<input type="date" data-f="start" value="${esc(p.start)}"></label>
        <label class="f">마감일<input type="date" data-f="end" value="${esc(p.end)}"></label>
        <label class="f">납기<input type="date" data-f="due" value="${esc(p.due)}"></label></div>
      <h4>발주처 담당자·연락처</h4>
      <textarea data-f="contact" rows="3" placeholder="담당자, 연락처, 메모">${esc(p.contact)}</textarea>
      <h4>링크 (드라이브, 리뷰, 레퍼런스)</h4><div id="lks"></div>
      <button class="ghost" data-act="addLink">+ 링크 추가</button></section>
    <div style="margin-top:28px;text-align:right"><button class="ghost danger" data-act="delProject">프로젝트 삭제</button></div>`;
    renderExp(p); updateBudget(p); renderLinks(p);
  }
}

function renderExp(p) {
  p.expenses ||= [];
  $("#exp").innerHTML = p.expenses.map((e, i) => `<div class="erow">
    <input list="exl" placeholder="항목" data-ek="n" data-i="${i}" value="${esc(e.n)}">
    <input type="number" step="any" inputmode="decimal" placeholder="금액(만원)" data-ek="a" data-i="${i}" value="${k(e.a)}">
    <button class="x" data-act="delExp" data-i="${i}" aria-label="지출 삭제">✕</button></div>`).join("") || `<div class="muted" style="margin-bottom:8px">지출 항목이 없어요.</div>`;
}
function renderLinks(p) {
  p.links ||= [];
  $("#lks").innerHTML = p.links.map((l, i) => `<div class="lrow">
    <input placeholder="이름" data-lk="t" data-i="${i}" value="${esc(l.t)}">
    <input placeholder="https://" inputmode="url" data-lk="u" data-i="${i}" value="${esc(l.u)}">
    <button class="x" data-act="openLink" data-i="${i}" aria-label="링크 열기">↗</button>
    <button class="x" data-act="delLink" data-i="${i}" aria-label="링크 삭제">✕</button></div>`).join("") || `<div class="muted" style="margin-bottom:8px">링크가 없어요.</div>`;
}
function updateBudget(p) {
  const e = $("#b-exp"); if (!e) return;
  const has = Number(p.contract) > 0;
  e.textContent = won(sumExp(p));
  $("#b-margin").textContent = has ? `${won(margin(p))} (${Math.round(margin(p) / p.contract * 100)}%)` : "-";
  $("#b-unpaid").textContent = has ? won(unpaid(p)) : "-";
}

/* ================= 이벤트 ================= */
app.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { F.q = t.value; renderContent(); return; }
  const p = cur(); if (!p) return;
  if (t.dataset.f) {
    const f = t.dataset.f;
    p[f] = NUM.includes(f) ? (t.value === "" ? "" : Math.round(Number(t.value) * 10000)) : t.value;
    if (NUM.includes(f)) updateBudget(p);
    persist(p);
  } else if (t.dataset.ek) {
    const i = +t.dataset.i;
    p.expenses[i][t.dataset.ek] = t.dataset.ek === "a" ? Math.round((Number(t.value) || 0) * 10000) : t.value;
    updateBudget(p); persist(p);
  } else if (t.dataset.lk) {
    p.links[+t.dataset.i][t.dataset.lk] = t.value; persist(p);
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "fcat") { F.cat = t.value; renderContent(); }
  else if (t.id === "fh1") { F.h1 = t.checked; renderContent(); }
  else if (t.id === "fh2") { F.h2 = t.checked; renderContent(); }
  else if (t.id === "fdone") { F.hideDone = t.checked; renderContent(); }
  else if (t.id === "fyear") { F.year = +t.value; isMonthly() || isTax() ? renderMain() : renderContent(); }
});

app.addEventListener("submit", async e => {
  if (e.target.id !== "qa") return;
  e.preventDefault();
  const name = $("#qa-n").value.trim(); if (!name) return;
  const np = mk([name, $("#qa-c").value, $("#qa-s").value, $("#qa-d").value, "", ""]);
  const b = $("#qa-b").value; if (b !== "") np.contract = Math.round(Number(b) * 10000);
  projects.push(np); renderContent();
  e.target.reset(); if (document.activeElement) document.activeElement.blur(); window.scrollTo({ top: 0 });
  try { await store.save(np); } catch (err) { alert("저장 실패: " + (err.code || err.message)); }
});
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, p = cur(), i = +b.dataset.i;
  if (act === "login") {
    Promise.resolve(store.signIn()).catch(err => {
      const c = err && err.code || "";
      const hint = c === "auth/unauthorized-domain" ? "\n\nFirebase > Authentication > 설정 > 승인된 도메인에 이 사이트 도메인을 추가하세요."
        : c === "auth/operation-not-allowed" ? "\n\nFirebase > Authentication > 로그인 방법에서 Google을 사용 설정하세요."
        : c === "auth/popup-blocked" ? "\n\n브라우저 팝업 차단을 해제하세요."
        : "";
      alert("로그인 실패: " + (c || (err && err.message) || err) + hint);
    });
  }
  else if (act === "logout") { flush(); if (confirm("로그아웃할까요?")) store.signOut(); }
  else if (act === "back") { flush(); location.hash = "#/"; }
  else if (act === "new") {
    if (location.hash !== "#/" && location.hash !== "") { location.hash = "#/"; await new Promise(r => setTimeout(r, 60)); }
    const n = $("#qa-n"); if (n) { n.scrollIntoView({ block: "center" }); n.focus(); }
  }
  else if (act === "seed") { await store.seed(SEED.map(mk)); }
  else if (act === "tab") { detailTab = b.dataset.t; if (p) renderPane(p); }
  else if (!p) return;
  else if (act === "today") {
    const ta = $("#notes"); ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n\n" : "") + `## ${todayStr()}\n`;
    p.notes = ta.value; persist(p); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  else if (act === "addExp") { p.expenses.push({ n: "", a: 0 }); renderExp(p); persist(p); }
  else if (act === "delExp") { p.expenses.splice(i, 1); renderExp(p); updateBudget(p); persist(p); }
  else if (act === "addLink") { p.links.push({ t: "", u: "" }); renderLinks(p); persist(p); }
  else if (act === "delLink") { p.links.splice(i, 1); renderLinks(p); persist(p); }
  else if (act === "openLink") {
    let u = (p.links[i].u || "").trim(); if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    window.open(u, "_blank", "noopener");
  }
  else if (act === "delProject") {
    if (!confirm(`'${p.name}' 프로젝트를 삭제할까요? 되돌릴 수 없어요.`)) return;
    pending.delete(p.id); projects = projects.filter(x => x.id !== p.id);
    await store.remove(p.id); location.hash = "#/";
  }
});

/* 보드 드래그앤드롭 (데스크톱) */
let dragId = null;
app.addEventListener("dragstart", e => { const c = e.target.closest(".kcard"); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
app.addEventListener("dragover", e => { const c = e.target.closest(".col"); if (c && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== c && x.classList.remove("over")); c.classList.add("over"); } });
app.addEventListener("drop", e => {
  const c = e.target.closest(".col"); if (!c || !dragId) return;
  e.preventDefault();
  const p = projects.find(x => x.id === dragId);
  if (p && p.status !== c.dataset.status) { p.status = c.dataset.status; persist(p); flush(); }
  dragId = null; renderContent();
});
app.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });

addEventListener("hashchange", () => { flush(); render(); });

/* ================= 시작 ================= */
function onData(list) {
  projects = list.map(x => pending.get(x.id) || x).map(x => x.status === normSt(x.status) ? x : { ...x, status: normSt(x.status) });
  projects.forEach(p => { p.expenses ||= []; p.links ||= []; });
  if (!ready) { ready = true; render(); return; }
  if (routeId()) return;
  if ($("#content")) renderContent(); else render();
}

(async () => {
  app.innerHTML = `<div class="login"><span class="muted">불러오는 중…</span></div>`;
  try { store = USE_FIREBASE ? await firebaseStore() : localStore(); }
  catch (err) { app.innerHTML = `<div class="empty" style="margin-top:40px">Firebase를 불러오지 못했어요.<br>${esc(err.message)}</div>`; return; }
  store.onAuth(u => {
    user = u; ready = false;
    if (!u) { projects = []; renderLogin(); return; }
    store.listen(onData);
  });
})();
</script>
</body>
</html>
